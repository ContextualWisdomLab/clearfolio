name: One-shot RCA-to-action scheduler repair v2

on:
  push:
    branches:
      - feat/hourly-opencode-commercial-loop
    paths:
      - .github/workflows/one-shot-rca-action-scheduler-v2.yml

concurrency:
  group: clearfolio-one-shot-rca-action-scheduler-v2
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-opencode-commercial-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Recover, correct, and execute verified patch program
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source_path = Path(".github/workflows/one-shot-rca-action-scheduler.yml")
          source_lines = source_path.read_text(encoding="utf-8").splitlines()
          start_marker = "          python3 - <<'PY'"
          end_marker = "          PY"
          start_matches = [index for index, line in enumerate(source_lines) if line == start_marker]
          if len(start_matches) != 1:
              raise SystemExit(f"expected one patch-program start, found {len(start_matches)}")
          start = start_matches[0] + 1
          end_matches = [
              index for index in range(start, len(source_lines)) if source_lines[index] == end_marker
          ]
          if len(end_matches) != 1:
              raise SystemExit(f"expected one patch-program end, found {len(end_matches)}")
          end = end_matches[0]
          program_lines = source_lines[start:end]
          if any(line and not line.startswith("          ") for line in program_lines):
              raise SystemExit("patch program escaped the YAML run-block indentation")
          program = "\n".join(
              line[10:] if line.startswith("          ") else line for line in program_lines
          ) + "\n"

          old_helper = "\n".join(
              [
                  "def exact_index(lines: list[str], expected: str, *, start: int = 0) -> int:",
                  "    matches = [index for index in range(start, len(lines)) if lines[index] == expected]",
                  "    if len(matches) != 1:",
                  "        raise SystemExit(",
                  "            f\"expected one exact line after {start}, found {len(matches)}: {expected!r}\"",
                  "        )",
                  "    return matches[0]",
              ]
          )
          new_helper = "\n".join(
              [
                  "def first_index(lines: list[str], expected: str, *, start: int = 0) -> int:",
                  "    for index in range(start, len(lines)):",
                  "        if lines[index] == expected:",
                  "            return index",
                  "    raise SystemExit(f\"missing exact line after {start}: {expected!r}\")",
              ]
          )
          if program.count(old_helper) != 1:
              raise SystemExit("unable to locate the strict repeated-gate helper")
          program = program.replace(old_helper, new_helper, 1).replace(
              "exact_index(", "first_index("
          )
          patch_program = Path("/tmp/rca-action-repair.py")
          patch_program.write_text(program, encoding="utf-8")
          subprocess.run(["python3", str(patch_program)], check=True)
          PY

          git rm .github/workflows/one-shot-rca-action-scheduler-v2.yml
          git diff --cached --check
          git commit --amend --no-edit

      - name: Record generated Git object identities
        run: |
          set -euo pipefail
          {
            echo "trigger_head=${{ github.sha }}"
            echo "green_commit=$(git rev-parse HEAD)"
            echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/hourly-product-development.yml)"
            echo "guide_blob=$(git rev-parse HEAD:docs/operations/hourly-development.md)"
            echo "changelog_blob=$(git rev-parse HEAD:CHANGELOG.md)"
            echo "contract_blob=$(git rev-parse HEAD:scripts/test_hourly_opencode_scheduler_contract.py)"
          } | tee "${RUNNER_TEMP}/rca-action-manifest.txt"

      - name: Upload generated objects to GitHub quarantine
        run: |
          set -euo pipefail
          set +e
          git push origin HEAD:feat/hourly-opencode-commercial-loop
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::notice::Expected workflow-permission rejection uploaded generated Git objects for connector publication."
          fi

      - name: Upload verified RCA-to-action repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-rca-action-scheduler-v2-${{ github.sha }}
          path: |
            .github/workflows/hourly-product-development.yml
            scripts/test_hourly_opencode_scheduler_contract.py
            docs/operations/hourly-development.md
            CHANGELOG.md
            ${{ runner.temp }}/rca-action-manifest.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
