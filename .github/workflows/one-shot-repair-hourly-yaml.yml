name: One-shot repair hourly scheduler YAML

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/one-shot-repair-hourly-yaml.yml

concurrency:
  group: clearfolio-one-shot-repair-hourly-yaml
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hourly-opencode-commercial-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-opencode-commercial-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Add RED YAML-structure contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/test_hourly_opencode_scheduler_contract.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_scheduler_step_blocks_preserve_yaml_indentation()"
          if marker in text:
              raise SystemExit("YAML indentation contract already exists")
          text += '''


def test_scheduler_step_blocks_preserve_yaml_indentation() -> None:
    """Keep generated env mappings and shell literals inside their workflow steps."""
    workflow = _read(PRODUCT_WORKFLOW)
    step_names = (
        "Enforce bounded autonomous queue and credential prerequisites",
        "Recheck bounded queue, disjoint paths, and exact-base preconditions",
        "Recheck bounded queue, disjoint paths, and patch identity",
        "Recheck immediately before Draft publication",
    )

    for step_name in step_names:
        remainder = workflow.split(f"      - name: {step_name}\n", 1)[1]
        next_step = remainder.find("\n      - name: ")
        step_block = remainder if next_step < 0 else remainder[:next_step]
        lines = step_block.splitlines()
        env_index = lines.index("        env:")
        run_index = lines.index("        run: |")
        assert env_index < run_index
        assert all(
            not line or line.startswith("          ")
            for line in lines[env_index + 1 : run_index]
        )
        assert all(
            not line or line.startswith("          ")
            for line in lines[run_index + 1 :]
        )
'''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify RED failure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/test_hourly_opencode_scheduler_contract.py")
          spec = importlib.util.spec_from_file_location("scheduler_contract", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load scheduler contract")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              module.test_scheduler_step_blocks_preserve_yaml_indentation()
          except AssertionError:
              print("RED confirmed: generated scheduler step content escaped YAML indentation.")
          else:
              raise SystemExit("RED contract unexpectedly passed before repair")
          PY

      - name: Commit RED contract locally
        run: |
          set -euo pipefail
          git config user.name "clearfolio-maintainer[bot]"
          git config user.email "clearfolio-maintainer[bot]@users.noreply.github.com"
          git add scripts/test_hourly_opencode_scheduler_contract.py
          git diff --cached --check
          git commit -m "test: require valid scheduler step indentation"

      - name: Repair four generated workflow step blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/hourly-product-development.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          step_names = (
              "Enforce bounded autonomous queue and credential prerequisites",
              "Recheck bounded queue, disjoint paths, and exact-base preconditions",
              "Recheck bounded queue, disjoint paths, and patch identity",
              "Recheck immediately before Draft publication",
          )

          for step_name in step_names:
              step_marker = f"      - name: {step_name}\n"
              matches = [index for index, line in enumerate(lines) if line == step_marker]
              if len(matches) != 1:
                  raise SystemExit(f"expected one step marker for {step_name!r}, found {len(matches)}")
              start = matches[0]
              end = next(
                  (
                      index
                      for index in range(start + 1, len(lines))
                      if lines[index].startswith("      - name: ")
                      or lines[index].startswith("  publish:")
                      or lines[index].startswith("  verify:")
                  ),
                  len(lines),
              )
              env_index = next(
                  index for index in range(start + 1, end) if lines[index] == "        env:\n"
              )
              run_index = next(
                  index for index in range(env_index + 1, end) if lines[index] == "        run: |\n"
              )
              for index in range(env_index + 1, run_index):
                  if lines[index].strip() and not lines[index].startswith("          "):
                      lines[index] = "          " + lines[index]
              for index in range(run_index + 1, end):
                  if lines[index].strip() and not lines[index].startswith("          "):
                      lines[index] = "          " + lines[index]

          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify GREEN contracts and YAML syntax
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/test_hourly_opencode_scheduler_contract.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/test_hourly_opencode_scheduler_contract.py")
          spec = importlib.util.spec_from_file_location("scheduler_contract", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load scheduler contract")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [
              (name, value)
              for name, value in vars(module).items()
              if name.startswith("test_") and callable(value)
          ]
          for name, test in sorted(tests):
              test()
              print(f"PASS {name}")
          print(f"{len(tests)} scheduler contract tests passed")
          PY
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' \
            .github/workflows/hourly-product-development.yml
          git diff --check

      - name: Commit GREEN repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-repair-hourly-yaml.yml
          git add .github/workflows/hourly-product-development.yml \
            scripts/test_hourly_opencode_scheduler_contract.py \
            .github/workflows/one-shot-repair-hourly-yaml.yml
          git diff --cached --check
          git commit -m "fix(automation): preserve scheduler YAML structure"

      - name: Record generated Git object identities
        run: |
          set -euo pipefail
          {
            echo "trigger_head=${{ github.event.pull_request.head.sha }}"
            echo "green_commit=$(git rev-parse HEAD)"
            echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/hourly-product-development.yml)"
            echo "contract_blob=$(git rev-parse HEAD:scripts/test_hourly_opencode_scheduler_contract.py)"
            sha256sum \
              .github/workflows/hourly-product-development.yml \
              scripts/test_hourly_opencode_scheduler_contract.py
          } >"${RUNNER_TEMP}/yaml-repair-manifest.txt"
          cat "${RUNNER_TEMP}/yaml-repair-manifest.txt"

      - name: Upload generated objects to GitHub quarantine
        id: push_attempt
        run: |
          set -euo pipefail
          push_log="${RUNNER_TEMP}/push-attempt.log"
          set +e
          git push origin HEAD:feat/hourly-opencode-commercial-loop >"$push_log" 2>&1
          status=$?
          set -e
          cat "$push_log"
          echo "status=$status" >>"$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "pushed=true" >>"$GITHUB_OUTPUT"
          else
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Expected workflow-permission rejection uploaded generated Git objects for connector publication."
          fi

      - name: Upload verified YAML repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-hourly-yaml-repair-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/hourly-product-development.yml
            scripts/test_hourly_opencode_scheduler_contract.py
            ${{ runner.temp }}/yaml-repair-manifest.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
