name: One-shot repair hourly scheduler YAML

on:
  pull_request:
    types:
      - synchronize

concurrency:
  group: clearfolio-one-shot-repair-hourly-yaml
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hourly-opencode-commercial-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-opencode-commercial-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Add RED contract, repair YAML, and verify GREEN
        env:
          CONTRACT_APPEND_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import importlib.util
          import os
          import subprocess
          from pathlib import Path

          contract_path = Path("scripts/test_hourly_opencode_scheduler_contract.py")
          workflow_path = Path(".github/workflows/hourly-product-development.yml")
          one_shot_path = Path(".github/workflows/one-shot-repair-hourly-yaml.yml")

          def run(*args: str) -> None:
              subprocess.run(args, check=True)

          def load_contract():
              spec = importlib.util.spec_from_file_location("scheduler_contract", contract_path)
              if spec is None or spec.loader is None:
                  raise SystemExit("unable to load scheduler contract")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          contract = contract_path.read_text(encoding="utf-8")
          marker = "def test_scheduler_step_blocks_preserve_yaml_indentation()"
          if marker in contract:
              raise SystemExit("YAML indentation contract already exists")
          contract += base64.b64decode(os.environ["CONTRACT_APPEND_B64"]).decode("utf-8")
          contract_path.write_text(contract, encoding="utf-8")

          module = load_contract()
          try:
              module.test_scheduler_step_blocks_preserve_yaml_indentation()
          except AssertionError:
              print("RED confirmed: scheduler step content escaped YAML indentation.")
          else:
              raise SystemExit("RED contract unexpectedly passed before repair")

          run("git", "config", "user.name", "clearfolio-maintainer[bot]")
          run("git", "config", "user.email", "clearfolio-maintainer[bot]@users.noreply.github.com")
          run("git", "add", str(contract_path))
          run("git", "diff", "--cached", "--check")
          run("git", "commit", "-m", "test: require valid scheduler step indentation")

          lines = workflow_path.read_text(encoding="utf-8").splitlines(keepends=True)
          step_names = (
              "Enforce bounded autonomous queue and credential prerequisites",
              "Recheck bounded queue, disjoint paths, and exact-base preconditions",
              "Recheck bounded queue, disjoint paths, and patch identity",
              "Recheck immediately before Draft publication",
          )
          for step_name in step_names:
              marker_text = f"      - name: {step_name}"
              matches = [
                  index for index, line in enumerate(lines) if line.rstrip("\n") == marker_text
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one step marker for {step_name!r}, found {len(matches)}"
                  )
              start = matches[0]
              end = next(
                  (
                      index
                      for index in range(start + 1, len(lines))
                      if lines[index].startswith("      - name: ")
                      or lines[index].startswith("  publish:")
                      or lines[index].startswith("  verify:")
                  ),
                  len(lines),
              )
              env_index = next(
                  index
                  for index in range(start + 1, end)
                  if lines[index].rstrip("\n") == "        env:"
              )
              run_index = next(
                  index
                  for index in range(env_index + 1, end)
                  if lines[index].rstrip("\n") == "        run: |"
              )
              for index in range(env_index + 1, run_index):
                  if lines[index].strip() and not lines[index].startswith("          "):
                      lines[index] = "          " + lines[index]
              for index in range(run_index + 1, end):
                  if lines[index].strip() and not lines[index].startswith("          "):
                      lines[index] = "          " + lines[index]
          workflow_path.write_text("".join(lines), encoding="utf-8")

          module = load_contract()
          tests = sorted(
              (name, value)
              for name, value in vars(module).items()
              if name.startswith("test_") and callable(value)
          )
          for name, test in tests:
              test()
              print(f"PASS {name}")
          print(f"{len(tests)} scheduler contract tests passed")
          run("ruby", "-e", 'require "yaml"; YAML.parse_file(ARGV.fetch(0))', str(workflow_path))
          run("git", "diff", "--check")
          one_shot_path.unlink()
          run("git", "add", str(workflow_path), str(contract_path), str(one_shot_path))
          run("git", "diff", "--cached", "--check")
          run("git", "commit", "-m", "fix(automation): preserve scheduler YAML structure")
          PY

      - name: Record generated Git object identities
        run: |
          set -euo pipefail
          {
            echo "trigger_head=${{ github.event.pull_request.head.sha }}"
            echo "green_commit=$(git rev-parse HEAD)"
            echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/hourly-product-development.yml)"
            echo "contract_blob=$(git rev-parse HEAD:scripts/test_hourly_opencode_scheduler_contract.py)"
            sha256sum \
              .github/workflows/hourly-product-development.yml \
              scripts/test_hourly_opencode_scheduler_contract.py
          } >"${RUNNER_TEMP}/yaml-repair-manifest.txt"
          cat "${RUNNER_TEMP}/yaml-repair-manifest.txt"

      - name: Upload generated objects to GitHub quarantine
        run: |
          set -euo pipefail
          set +e
          git push origin HEAD:feat/hourly-opencode-commercial-loop
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::notice::Expected workflow-permission rejection uploaded generated Git objects."
          fi

      - name: Upload verified YAML repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-hourly-yaml-repair-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/hourly-product-development.yml
            scripts/test_hourly_opencode_scheduler_contract.py
            ${{ runner.temp }}/yaml-repair-manifest.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
