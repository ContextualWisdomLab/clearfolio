name: One-shot tenant missing identifier RED

on:
  pull_request:
    branches:
      - fix/pii-logging-16240128950440010639
    paths:
      - .github/workflows/one-shot-tenant-null-id-red.yml

permissions:
  contents: read

jobs:
  prove-red:
    if: >-
      github.repository == 'ContextualWisdomLab/clearfolio'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'fix/admin-endpoint-auth-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use preinstalled Temurin JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Prove missing scoped identifier contract is RED
        run: >-
          mvn -B --no-transfer-progress
          -Dtest=InMemoryConversionJobRepositoryMissingIdentifierTest
          test
