name: One-shot update hourly product scheduler

on:
  push:
    branches:
      - feat/hourly-opencode-commercial-loop
    paths:
      - .github/workflows/one-shot-update-hourly-scheduler.yml

concurrency:
  group: clearfolio-one-shot-hourly-scheduler-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PATCH_SOURCE_COMMIT: 5651b3275bf2cd6d0bd7373c765f811d5b70ac5b

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-opencode-commercial-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Recover reviewed RED and GREEN patch programs
        run: |
          set -euo pipefail
          source_file="${RUNNER_TEMP}/scheduler-patch-source.yml"
          git show "${PATCH_SOURCE_COMMIT}:.github/workflows/one-shot-update-hourly-scheduler.yml" >"$source_file"
          SOURCE_FILE="$source_file" OUTPUT_DIR="$RUNNER_TEMP" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"]).read_text(encoding="utf-8")
          pattern = re.compile(
              r"^          python3 - <<'PY'\n(?P<body>.*?)^          PY\n",
              flags=re.MULTILINE | re.DOTALL,
          )
          blocks = [match.group("body") for match in pattern.finditer(source)]
          if len(blocks) != 4:
              raise SystemExit(f"expected four reviewed Python blocks, found {len(blocks)}")
          output_dir = Path(os.environ["OUTPUT_DIR"])
          for index, block in enumerate(blocks):
              lines = block.splitlines()
              dedented = "\n".join(
                  line[10:] if line.startswith("          ") else line for line in lines
              )
              output = output_dir / f"scheduler-patch-{index}.py"
              output.write_text(dedented + "\n", encoding="utf-8")
          PY

      - name: Add and verify RED scheduler contract
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scheduler-patch-0.py"
          python3 "${RUNNER_TEMP}/scheduler-patch-1.py"

      - name: Commit RED contract
        run: |
          set -euo pipefail
          git config user.name "clearfolio-maintainer[bot]"
          git config user.email "clearfolio-maintainer[bot]@users.noreply.github.com"
          git add scripts/test_hourly_opencode_scheduler_contract.py
          git diff --cached --check
          git commit -m "test: require productive work during approval latency"

      - name: Implement and verify bounded disjoint scheduling
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scheduler-patch-2.py"
          python3 "${RUNNER_TEMP}/scheduler-patch-3.py"

      - name: Commit implementation and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-update-hourly-scheduler.yml
          git add .github/workflows/hourly-product-development.yml \
            scripts/test_hourly_opencode_scheduler_contract.py \
            docs/operations/hourly-development.md \
            docs/operations/2026-08-07-post-token-publication-gate.md \
            CHANGELOG.md \
            .github/workflows/one-shot-update-hourly-scheduler.yml
          git diff --cached --check
          git commit -m "fix(automation): continue disjoint work during approval latency"

      - name: Push test-first scheduler update
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/hourly-opencode-commercial-loop
