name: One-shot update hourly product scheduler

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/one-shot-update-hourly-scheduler.yml

concurrency:
  group: clearfolio-one-shot-hourly-scheduler-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PATCH_SOURCE_COMMIT: 5651b3275bf2cd6d0bd7373c765f811d5b70ac5b

jobs:
  update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hourly-opencode-commercial-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-opencode-commercial-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Recover reviewed RED and GREEN patch programs
        run: |
          set -euo pipefail
          source_file="${RUNNER_TEMP}/scheduler-patch-source.yml"
          git show "${PATCH_SOURCE_COMMIT}:.github/workflows/one-shot-update-hourly-scheduler.yml" >"$source_file"
          SOURCE_FILE="$source_file" OUTPUT_DIR="$RUNNER_TEMP" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"]).read_text(encoding="utf-8")
          pattern = re.compile(
              r"^          python3 - <<'PY'\n(?P<body>.*?)^          PY\n",
              flags=re.MULTILINE | re.DOTALL,
          )
          blocks = [match.group("body") for match in pattern.finditer(source)]
          if len(blocks) != 4:
              raise SystemExit(f"expected four reviewed Python blocks, found {len(blocks)}")
          output_dir = Path(os.environ["OUTPUT_DIR"])
          for index, block in enumerate(blocks):
              lines = block.splitlines()
              dedented = "\n".join(
                  line[10:] if line.startswith("          ") else line for line in lines
              )
              output = output_dir / f"scheduler-patch-{index}.py"
              output.write_text(dedented + "\n", encoding="utf-8")
          PY

      - name: Repair exact multiline replacement matching
        run: |
          set -euo pipefail
          PATCH_PROGRAM="${RUNNER_TEMP}/scheduler-patch-2.py" RED_PROGRAM="${RUNNER_TEMP}/scheduler-patch-0.py" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PATCH_PROGRAM"])
          source = path.read_text(encoding="utf-8")
          old = "\n".join([
              "def replace_once(source: str, old: str, new: str) -> str:",
              "    count = source.count(old)",
              "    if count != 1:",
              "        raise SystemExit(f\"expected one occurrence, found {count}: {old!r}\")",
              "    return source.replace(old, new, 1)",
              "",
          ])
          new = "\n".join([
              "def replace_once(source: str, old: str, new: str) -> str:",
              "    count = source.count(old)",
              "    if count == 1:",
              "        return source.replace(old, new, 1)",
              "    if count > 1:",
              "        raise SystemExit(f\"expected one occurrence, found {count}: {old!r}\")",
              "",
              "    source_lines = source.splitlines(keepends=True)",
              "    old_lines = old.splitlines(keepends=True)",
              "    matches: list[int] = []",
              "    for index in range(len(source_lines) - len(old_lines) + 1):",
              "        window = source_lines[index : index + len(old_lines)]",
              "        if all(",
              "            source_line.lstrip(\" \") == old_line.lstrip(\" \")",
              "            for source_line, old_line in zip(window, old_lines, strict=True)",
              "        ):",
              "            matches.append(index)",
              "    if len(matches) != 1:",
              "        raise SystemExit(",
              "            f\"expected one indentation-insensitive occurrence, found {len(matches)}: {old!r}\"",
              "        )",
              "",
              "    new_lines = new.splitlines(keepends=True)",
              "    repaired_new = \"\".join(",
              "        line if line_number == 0 or not line.strip() else \"          \" + line",
              "        for line_number, line in enumerate(new_lines)",
              "    )",
              "    index = matches[0]",
              "    return (",
              "        \"\".join(source_lines[:index])",
              "        + repaired_new",
              "        + \"\".join(source_lines[index + len(old_lines) :])",
              "    )",
              "",
          ])
          if source.count(old) != 1:
              raise SystemExit("unable to locate exact replace_once helper")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

          red_path = Path(os.environ["RED_PROGRAM"])
          red_source = red_path.read_text(encoding="utf-8")
          stale_assertion = 'assert "Existing open pull requests may still be waiting" in workflow'
          robust_assertions = (
              'assert "Existing open" in workflow\n'
              '    assert "pull requests may still be waiting" in workflow'
          )
          if red_source.count(stale_assertion) != 1:
              raise SystemExit("unable to locate wrapped prompt assertion")
          red_path.write_text(
              red_source.replace(stale_assertion, robust_assertions, 1),
              encoding="utf-8",
          )
          PY

      - name: Add and verify RED scheduler contract
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scheduler-patch-0.py"
          python3 "${RUNNER_TEMP}/scheduler-patch-1.py"

      - name: Commit RED contract
        run: |
          set -euo pipefail
          git config user.name "clearfolio-maintainer[bot]"
          git config user.email "clearfolio-maintainer[bot]@users.noreply.github.com"
          git add scripts/test_hourly_opencode_scheduler_contract.py
          git diff --cached --check
          git commit -m "test: require productive work during approval latency"

      - name: Implement and verify bounded disjoint scheduling
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scheduler-patch-2.py"
          python3 "${RUNNER_TEMP}/scheduler-patch-3.py"

      - name: Commit implementation and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-update-hourly-scheduler.yml
          git add .github/workflows/hourly-product-development.yml \
            scripts/test_hourly_opencode_scheduler_contract.py \
            docs/operations/hourly-development.md \
            docs/operations/2026-08-07-post-token-publication-gate.md \
            CHANGELOG.md \
            .github/workflows/one-shot-update-hourly-scheduler.yml
          git diff --cached --check
          git commit -m "fix(automation): continue disjoint work during approval latency"

      - name: Push test-first scheduler update
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/hourly-opencode-commercial-loop
