name: Release acceptance

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build tagged release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use preinstalled Temurin JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Run API and buyer-readiness contract tests
        run: python -m pytest -q scripts

      - name: Bind tag to Maven version with pinned help:evaluate -Dexpression=project.version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(mvn -q --no-transfer-progress org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          test -n "$PROJECT_VERSION"
          test "$GITHUB_REF_NAME" = "v$PROJECT_VERSION"
          printf '%s\n' "$PROJECT_VERSION" > "$RUNNER_TEMP/clearfolio-project-version"

      - name: Run authoritative Maven acceptance
        run: mvn -B --no-transfer-progress verify

      - name: Generate CycloneDX SBOM
        run: mvn -B --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Enforce buyer-release license policy
        run: |
          python3 scripts/check_sbom_license_policy.py \
            --sbom target/bom.json \
            --policy docs/security/2026-07-02-license-policy.json \
            --summary target/license-policy.json \
            --require-no-review

      - name: Build immutable release evidence bundle
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(cat "$RUNNER_TEMP/clearfolio-project-version")"
          JAR="target/clearfolio-viewer-${PROJECT_VERSION}.jar"
          test -f "$JAR"
          test -f target/bom.json
          test -f target/license-policy.json

          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.openapi_release_provenance import (
              build_openapi_release_provenance,
              render_openapi_release_provenance,
          )

          repository_root = Path.cwd()
          record = build_openapi_release_provenance(
              repository_root,
              os.environ["SOURCE_REVISION"],
          )
          Path("target/openapi-release-provenance.json").write_text(
              render_openapi_release_provenance(record),
              encoding="utf-8",
          )
          PY

          mkdir -p target/release-evidence
          cp "$JAR" target/release-evidence/
          cp target/bom.json target/release-evidence/sbom-cyclonedx.json
          cp target/license-policy.json target/release-evidence/license-policy.json
          cp target/openapi-release-provenance.json target/release-evidence/
          cp docs/deployment/clearfolio-buyer-connector.openapi.yaml target/release-evidence/
          cp pom.xml target/release-evidence/pom.xml
          printf '%s\n' "$SOURCE_REVISION" > target/release-evidence/source-revision.txt
          printf '%s\n' "$GITHUB_REF_NAME" > target/release-evidence/source-tag.txt
          (
            cd target/release-evidence
            sha256sum \
              "clearfolio-viewer-${PROJECT_VERSION}.jar" \
              clearfolio-buyer-connector.openapi.yaml \
              openapi-release-provenance.json \
              sbom-cyclonedx.json \
              license-policy.json \
              pom.xml \
              source-revision.txt \
              source-tag.txt \
              > release-manifest.sha256
          )

      - name: Upload tagged release acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clearfolio-release-acceptance-${{ github.ref_name }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
