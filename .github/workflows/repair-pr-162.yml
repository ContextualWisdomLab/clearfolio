name: Repair PR 162 accessibility integration

on:
  push:
    branches:
      - jules-palette-ux-a11y-demo-js-18084169557556592466
    paths:
      - .github/workflows/repair-pr-162.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-162-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/clearfolio' &&
      github.ref_name == 'jules-palette-ux-a11y-demo-js-18084169557556592466' &&
      github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: jules-palette-ux-a11y-demo-js-18084169557556592466
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore canonical files and write failing regression tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/fuzz.yml \
            .jules/palette.md \
            src/test/java/com/clearfolio/viewer/controller/ViewerUiControllerTest.java

          cat > src/test/js/dom-utils.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            createActionButton,
            createLink,
            setBusyState,
          } from "../../main/resources/static/assets/viewer/dom-utils.js";

          class MockElement {
            constructor(tagName) {
              this.tagName = tagName.toUpperCase();
              this.attributes = new Map();
              this.childNodes = [];
              this.disabled = false;
              this.className = "";
              this.type = "";
              this.href = "";
              this.target = "";
              this.rel = "";
              this.listeners = new Map();
            }

            get textContent() {
              return this.childNodes
                .filter(node => node.type === "text")
                .map(node => node.value)
                .join("");
            }

            set textContent(value) {
              this.childNodes = [{ type: "text", value: String(value) }];
            }

            hasAttribute(name) {
              return this.attributes.has(name);
            }

            getAttribute(name) {
              return this.attributes.has(name) ? this.attributes.get(name) : null;
            }

            setAttribute(name, value) {
              this.attributes.set(name, String(value));
            }

            removeAttribute(name) {
              this.attributes.delete(name);
            }

            replaceChildren(...nodes) {
              this.childNodes = nodes;
            }

            addEventListener(type, listener) {
              this.listeners.set(type, listener);
            }

            dispatch(type) {
              this.listeners.get(type)?.({ currentTarget: this });
            }
          }

          globalThis.document = {
            createElement(tagName) {
              return new MockElement(tagName);
            },
          };

          test("busy state restores original node identity and absent ARIA attributes", () => {
            const button = new MockElement("button");
            const iconNode = { type: "icon", name: "document" };
            const textNode = { type: "text", value: "Submit" };
            button.childNodes = [iconNode, textNode];

            const restore = setBusyState(button, "Submitting...");

            assert.equal(button.disabled, true);
            assert.equal(button.textContent, "Submitting...");
            assert.equal(button.getAttribute("aria-busy"), "true");
            assert.equal(button.getAttribute("aria-label"), "Submitting...");

            restore();

            assert.equal(button.disabled, false);
            assert.equal(button.hasAttribute("aria-busy"), false);
            assert.equal(button.hasAttribute("aria-label"), false);
            assert.strictEqual(button.childNodes[0], iconNode);
            assert.strictEqual(button.childNodes[1], textNode);
          });

          test("busy state restores pre-existing accessibility and disabled state", () => {
            const button = new MockElement("button");
            button.textContent = "Details";
            button.disabled = true;
            button.setAttribute("aria-busy", "false");
            button.setAttribute("aria-label", "View details for board-pack.pdf");

            const restore = setBusyState(button, "Loading...");

            assert.equal(
              button.getAttribute("aria-label"),
              "Loading... View details for board-pack.pdf",
            );
            restore();

            assert.equal(button.disabled, true);
            assert.equal(button.getAttribute("aria-busy"), "false");
            assert.equal(
              button.getAttribute("aria-label"),
              "View details for board-pack.pdf",
            );
          });

          test("busy state distinguishes an explicit empty accessible name", () => {
            const button = new MockElement("button");
            button.textContent = "Details";
            button.setAttribute("aria-label", "");

            const restore = setBusyState(button, "Loading...");
            assert.equal(button.getAttribute("aria-label"), "Loading...");

            restore();
            assert.equal(button.hasAttribute("aria-label"), true);
            assert.equal(button.getAttribute("aria-label"), "");
          });

          test("nested busy calls and duplicate restores preserve the first snapshot", () => {
            const button = new MockElement("button");
            button.textContent = "Refresh";

            const restoreOuter = setBusyState(button, "Refreshing...");
            const restoreInner = setBusyState(button, "Still refreshing...");

            assert.equal(button.textContent, "Refreshing...");
            restoreInner();
            restoreInner();
            assert.equal(button.disabled, true);
            assert.equal(button.getAttribute("aria-busy"), "true");

            restoreOuter();
            assert.equal(button.disabled, false);
            assert.equal(button.textContent, "Refresh");
          });

          test("action buttons support provided, empty, and omitted accessible names", () => {
            let clicks = 0;
            const named = createActionButton(
              "Details",
              () => { clicks += 1; },
              "View details for report.pdf",
            );
            const empty = createActionButton("Details", () => {}, "");
            const omitted = createActionButton("Details", () => {});

            named.dispatch("click");
            assert.equal(clicks, 1);
            assert.equal(named.getAttribute("aria-label"), "View details for report.pdf");
            assert.equal(empty.getAttribute("aria-label"), "");
            assert.equal(omitted.hasAttribute("aria-label"), false);
          });

          test("links support provided, empty, and omitted accessible names", () => {
            const named = createLink("/viewer/document", "Open", "Open report.pdf");
            const empty = createLink("/viewer/document", "Open", "");
            const omitted = createLink("/viewer/document", "Open");

            assert.equal(named.href, "/viewer/document");
            assert.equal(named.target, "_blank");
            assert.equal(named.rel, "noopener noreferrer");
            assert.equal(named.getAttribute("aria-label"), "Open report.pdf");
            assert.equal(empty.getAttribute("aria-label"), "");
            assert.equal(omitted.hasAttribute("aria-label"), false);
          });
          EOF

          cat > src/test/js/demo-integration.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";

          class MockElement {
            constructor(tagName = "div") {
              this.tagName = tagName.toUpperCase();
              this.attributes = new Map();
              this.childNodes = [];
              this.listeners = new Map();
              this.disabled = false;
              this.hidden = false;
              this.className = "";
              this.type = "";
              this.href = "";
              this.target = "";
              this.rel = "";
            }

            get textContent() {
              return this.childNodes
                .filter(node => node.type === "text")
                .map(node => node.value)
                .join("");
            }

            set textContent(value) {
              this.childNodes = [{ type: "text", value: String(value) }];
            }

            appendChild(node) {
              this.childNodes.push(node);
              return node;
            }

            append(...nodes) {
              this.childNodes.push(...nodes);
            }

            replaceChildren(...nodes) {
              this.childNodes = nodes;
            }

            addEventListener(type, listener) {
              this.listeners.set(type, listener);
            }

            hasAttribute(name) {
              return this.attributes.has(name);
            }

            getAttribute(name) {
              return this.attributes.has(name) ? this.attributes.get(name) : null;
            }

            setAttribute(name, value) {
              this.attributes.set(name, String(value));
            }

            removeAttribute(name) {
              this.attributes.delete(name);
            }

            focus() {}

            reset() {}
          }

          test("the executable demo renders contextual actions from the shared helper module", async () => {
            const elements = new Map();
            const elementIds = [
              "upload-form", "file-input", "submit-btn", "demo-status", "demo-error",
              "demo-error-message", "demo-error-title", "load-demo-data-btn", "history-body",
              "empty-history", "clear-history-btn", "kpi-total", "kpi-ready",
              "kpi-success-rate", "kpi-p95", "kpi-export-count", "kpi-export-latest",
              "kpi-export-subject", "kpi-export-jobs", "kpi-export-status",
              "refresh-evidence-btn", "recovery-needs-action", "recovery-retry-ready",
              "recovery-last-action", "recovery-latest-inspected", "recovery-status",
              "job-detail", "job-detail-caption", "job-detail-body", "retry-job-btn",
            ];
            for (const id of elementIds) {
              elements.set(id, new MockElement());
            }

            globalThis.document = {
              getElementById(id) {
                return elements.get(id);
              },
              createElement(tagName) {
                return new MockElement(tagName);
              },
            };
            globalThis.window = {
              confirm() { return true; },
              open() { return null; },
            };
            globalThis.localStorage = {
              getItem() {
                return JSON.stringify([{
                  fileName: "<img src=x onerror=alert(1)>.pdf",
                  status: "SUCCEEDED",
                  submittedAt: "2026-08-05T00:00:00Z",
                  jobId: "document-identifier",
                  statusUrl: "/api/v1/convert/jobs/document-identifier",
                }]);
              },
              setItem() {},
            };
            globalThis.fetch = async () => ({
              ok: false,
              headers: { get() { return "application/json"; } },
              async json() { return null; },
            });

            const moduleUrl = new URL(
              "../../main/resources/static/assets/viewer/demo.js",
              import.meta.url,
            );
            moduleUrl.searchParams.set("test-run", String(Date.now()));
            await import(moduleUrl.href);
            await new Promise(resolve => setImmediate(resolve));

            const rows = elements.get("history-body").childNodes;
            assert.equal(rows.length, 1);
            const [fileCell, , , actionsCell] = rows[0].childNodes;
            assert.equal(fileCell.textContent, "<img src=x onerror=alert(1)>.pdf");
            assert.equal(actionsCell.childNodes.length, 3);
            assert.equal(
              actionsCell.childNodes[0].getAttribute("aria-label"),
              "View details for <img src=x onerror=alert(1)>.pdf",
            );
            assert.equal(
              actionsCell.childNodes[1].getAttribute("aria-label"),
              "View status JSON for <img src=x onerror=alert(1)>.pdf",
            );
            assert.equal(
              actionsCell.childNodes[2].getAttribute("aria-label"),
              "Open viewer for <img src=x onerror=alert(1)>.pdf",
            );
          });
          EOF

          set +e
          node --test \
            src/test/js/dom-utils.test.mjs \
            src/test/js/demo-integration.test.mjs \
            > /tmp/pr162-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/pr162-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "Regression tests unexpectedly passed before the repair" >&2
            exit 1
          fi
          grep -Eq "createActionButton is not defined|explicit empty accessible name" /tmp/pr162-red.log

      - name: Implement the minimal shared-helper repair
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main/resources/static/assets/viewer/dom-utils.js <<'EOF'
          /** Shared accessible DOM helpers for the Clearfolio buyer-demo surface. */
          const busyStates = new WeakMap();

          /**
           * Applies a nested, idempotently restorable busy state to a control.
           *
           * @param {HTMLElement} element control whose state must be preserved
           * @param {string} loadingText visible and accessible pending label
           * @returns {() => void} idempotent restoration callback
           */
          export function setBusyState(element, loadingText) {
            let state = busyStates.get(element);
            if (state === undefined) {
              state = {
                depth: 0,
                originalNodes: Array.from(element.childNodes),
                originalDisabled: element.disabled,
                hadAriaBusy: element.hasAttribute("aria-busy"),
                originalAriaBusy: element.getAttribute("aria-busy"),
                hadAriaLabel: element.hasAttribute("aria-label"),
                originalAriaLabel: element.getAttribute("aria-label"),
              };
              busyStates.set(element, state);

              element.disabled = true;
              element.textContent = loadingText;
              element.setAttribute("aria-busy", "true");
              let pendingAriaLabel = loadingText;
              if (state.hadAriaLabel && state.originalAriaLabel.length > 0) {
                pendingAriaLabel = `${loadingText} ${state.originalAriaLabel}`;
              }
              element.setAttribute("aria-label", pendingAriaLabel);
            }

            state.depth += 1;
            let restorePending = true;
            return function restore() {
              if (!restorePending) {
                return;
              }
              restorePending = false;
              state.depth -= 1;
              if (state.depth > 0) {
                return;
              }

              busyStates.delete(element);
              element.replaceChildren(...state.originalNodes);
              element.disabled = state.originalDisabled;
              if (state.hadAriaBusy) {
                element.setAttribute("aria-busy", state.originalAriaBusy);
              } else {
                element.removeAttribute("aria-busy");
              }
              if (state.hadAriaLabel) {
                element.setAttribute("aria-label", state.originalAriaLabel);
              } else {
                element.removeAttribute("aria-label");
              }
            };
          }

          /**
           * Creates a new-context table link with an optional accessible name.
           *
           * @param {string} href destination
           * @param {string} label visible link label
           * @param {string} [ariaLabel] contextual accessible name
           * @returns {HTMLAnchorElement} configured link
           */
          export function createLink(href, label, ariaLabel) {
            const link = document.createElement("a");
            link.href = href;
            link.textContent = label;
            link.className = "table-link";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            if (ariaLabel !== undefined) {
              link.setAttribute("aria-label", ariaLabel);
            }
            return link;
          }

          /**
           * Creates a compact table action with an optional accessible name.
           *
           * @param {string} label visible button label
           * @param {(event: Event) => void} onClick click handler
           * @param {string} [ariaLabel] contextual accessible name
           * @returns {HTMLButtonElement} configured button
           */
          export function createActionButton(label, onClick, ariaLabel) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.className = "btn btn-secondary btn-compact";
            if (ariaLabel !== undefined) {
              button.setAttribute("aria-label", ariaLabel);
            }
            button.addEventListener("click", onClick);
            return button;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          demo_path = Path("src/main/resources/static/assets/viewer/demo.js")
          demo = demo_path.read_text(encoding="utf-8")
          import_line = (
              'import { createActionButton, createLink, setBusyState } '
              'from "./dom-utils.js";\n\n'
          )
          if not demo.startswith(import_line):
              demo = import_line + demo
          helper_pattern = re.compile(
              r"\nfunction setBusyState\(btn, loadingText\) \{.*?\n\}\n",
              re.DOTALL,
          )
          demo, replacements = helper_pattern.subn("\n", demo, count=1)
          if replacements != 1:
              raise SystemExit("expected exactly one duplicate setBusyState helper")
          demo_path.write_text(demo, encoding="utf-8")

          pom_path = Path("pom.xml")
          pom = pom_path.read_text(encoding="utf-8")
          old_arguments = """              <arguments>
                          <argument>src/test/js/dom-utils.test.mjs</argument>
                        </arguments>"""
          new_arguments = """              <arguments>
                          <argument>--test</argument>
                          <argument>--experimental-test-coverage</argument>
                          <argument>--test-coverage-include=src/main/resources/static/assets/viewer/dom-utils.js</argument>
                          <argument>--test-coverage-lines=100</argument>
                          <argument>--test-coverage-branches=100</argument>
                          <argument>--test-coverage-functions=100</argument>
                          <argument>src/test/js/dom-utils.test.mjs</argument>
                          <argument>src/test/js/demo-integration.test.mjs</argument>
                        </arguments>"""
          if pom.count(old_arguments) != 1:
              raise SystemExit("unexpected Maven Node-test argument block")
          pom_path.write_text(pom.replace(old_arguments, new_arguments), encoding="utf-8")

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text(encoding="utf-8")
          marker = "      - name: Use preinstalled Temurin JDK 21\n"
          setup_node = """      - name: Use Node.js 24 for executable accessibility tests
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                  node-version: '24'
                  package-manager-cache: false
          """
          if marker not in ci:
              raise SystemExit("CI insertion point is missing")
          ci_path.write_text(ci.replace(marker, setup_node + marker, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading_index = changelog.find("# Changelog")
          if heading_index < 0:
              raise SystemExit("canonical changelog heading is missing")
          changelog = changelog[heading_index:]
          section = "### 추가된 기능 (Added)\n"
          addition = """### 추가된 기능 (Added)
          - **접근 가능한 비동기 상태와 테이블 작업**
            - 반복되는 테이블 작업에 문서별 accessible name을 제공하고, 공유 WeakMap helper가 중첩 비동기 작업에서도 원래 DOM 노드·disabled·ARIA 상태를 정확히 복원하도록 했습니다.
            - 실제 `demo.js` 모듈을 실행하는 회귀 테스트와 Node.js line·branch·function coverage 100% 게이트를 추가했습니다.
          """
          if changelog.count(section) != 1:
              raise SystemExit("unexpected Added section count")
          changelog_path.write_text(
              changelog.replace(section, addition, 1),
              encoding="utf-8",
          )

          palette_path = Path(".jules/palette.md")
          palette = palette_path.read_text(encoding="utf-8").rstrip()
          palette += """

          ## 2026-08-05 - Executable async-state accessibility contract
          **Learning:** Accessibility helpers are only trustworthy when the production module imports and executes the same implementation that tests cover. Green helper tests do not prove integration when a consumer retains a duplicate local function or omits the import entirely.
          **Action:** Keep one shared module for busy-state and contextual-action behavior, execute the consuming demo module with non-empty history in tests, preserve original DOM and ARIA state, and enforce 100% line, branch, and function coverage for the shipped helper.
          """
          palette_path.write_text(palette.lstrip() + "\n", encoding="utf-8")
          PY

      - name: Prove the repaired behavior and coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            --experimental-test-coverage \
            --test-coverage-include=src/main/resources/static/assets/viewer/dom-utils.js \
            --test-coverage-lines=100 \
            --test-coverage-branches=100 \
            --test-coverage-functions=100 \
            src/test/js/dom-utils.test.mjs \
            src/test/js/demo-integration.test.mjs
          mvn --batch-mode --no-transfer-progress test
          mvn --batch-mode --no-transfer-progress -q -DskipTests javadoc:javadoc
          git diff --check

      - name: Commit only the verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-162.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: wire executable accessibility helpers"
          git push origin HEAD:jules-palette-ux-a11y-demo-js-18084169557556592466
