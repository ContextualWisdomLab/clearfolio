name: Storybook Design System

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  storybook:
    name: Storybook browser acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install development dependencies from checked-in lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run executable design-system contract tests
        run: python3 -m unittest discover -s scripts

      - name: Install Chromium for Vitest browser mode
        run: npx --no-install playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Storybook browser tests
        run: npm run test-storybook -- --run
