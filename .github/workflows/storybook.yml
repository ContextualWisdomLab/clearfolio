name: Storybook lock bootstrap

on:
  pull_request: {}

permissions:
  actions: read
  contents: write

jobs:
  bootstrap-reviewed-lock:
    name: Commit reviewed Storybook lock once
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: "9457584607"
      EXPECTED_LOCK_SHA256: "6ac5ecda7fcbdda3fc9a028dd455b0e018acf6f4cb792a6b8c5ac4ee25357af6"
      EXPECTED_PACKAGE_JSON_BLOB: "22cbba43925bcb6356eb5741c25f7f95ba85367e"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable dependency input
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object package.json)" = "$EXPECTED_PACKAGE_JSON_BLOB"
          test ! -e package-lock.json

      - name: Recover exact reviewed lock artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/storybook-lock
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/storybook-lock.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q /tmp/storybook-lock.zip -d /tmp/storybook-lock
          test "$(sha256sum /tmp/storybook-lock/package-lock.json | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"

      - name: Commit lock plus final fail-closed workflow atomically
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/storybook.final.yml <<'FINAL_WORKFLOW'
          name: Storybook Design System

          on:
            pull_request: {}

          permissions:
            contents: read

          jobs:
            storybook:
              name: Storybook browser acceptance
              runs-on: ubuntu-latest
              steps:
                - name: Checkout exact pull request head
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                    ref: ${{ github.event.pull_request.head.sha }}

                - name: Verify exact checked-out revision
                  env:
                    EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
                  run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

                - name: Setup Node.js
                  uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
                  with:
                    node-version: "24"

                - name: Install development dependencies from checked-in lock
                  run: npm ci --ignore-scripts --no-audit --no-fund

                - name: Run executable design-system contract tests
                  run: python3 -m unittest discover -s scripts

                - name: Install Chromium for Vitest browser mode
                  run: npx --no-install playwright install --with-deps chromium

                - name: Build Storybook
                  run: npm run build-storybook

                - name: Run Storybook browser tests
                  run: npm run test-storybook -- --run
          FINAL_WORKFLOW

          CURRENT_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$CURRENT_HEAD" = "$EXPECTED_SHA"

          BASE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_SHA}" --jq .tree.sha)"
          LOCK_B64="$(base64 -w0 /tmp/storybook-lock/package-lock.json)"
          LOCK_BLOB="$(jq -n --arg content "$LOCK_B64" '{content:$content,encoding:"base64"}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          WORKFLOW_CONTENT="$(cat /tmp/storybook.final.yml)"
          WORKFLOW_BLOB="$(jq -n --arg content "$WORKFLOW_CONTENT" '{content:$content,encoding:"utf-8"}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          NEW_TREE="$(jq -n \
            --arg base "$BASE_TREE" \
            --arg lock "$LOCK_BLOB" \
            --arg workflow "$WORKFLOW_BLOB" \
            '{base_tree:$base,tree:[
              {path:"package-lock.json",mode:"100644",type:"blob",sha:$lock},
              {path:".github/workflows/storybook.yml",mode:"100644",type:"blob",sha:$workflow}
            ]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          NEW_COMMIT="$(jq -n \
            --arg message "fix(design): lock Storybook dependency graph" \
            --arg tree "$NEW_TREE" \
            --arg parent "$EXPECTED_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          CURRENT_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$CURRENT_HEAD" = "$EXPECTED_SHA"
          jq -n --arg sha "$NEW_COMMIT" '{sha:$sha,force:false}' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}" --input - >/dev/null
